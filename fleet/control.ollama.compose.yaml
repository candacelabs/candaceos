services:
  core:
    environment:
      CANDACEOS_HARNESS_BACKEND: ollama
      CANDACEOS_OLLAMA_URL: ${CANDACEOS_OLLAMA_URL:?fleet environment is incomplete}
      CANDACEOS_OLLAMA_MODEL: ${CANDACEOS_OLLAMA_MODEL:?fleet environment is incomplete}
      CANDACEOS_OLLAMA_MODEL_DIGEST: ${CANDACEOS_OLLAMA_MODEL_DIGEST:?fleet environment is incomplete}
      CANDACEOS_OLLAMA_CONTEXT_TOKENS: ${CANDACEOS_OLLAMA_CONTEXT_TOKENS:-16384}
      CANDACEOS_OLLAMA_MAX_TOOL_CALLS: ${CANDACEOS_OLLAMA_MAX_TOOL_CALLS:-16}
      CANDACEOS_OLLAMA_TURN_TIMEOUT: ${CANDACEOS_OLLAMA_TURN_TIMEOUT:-10m}
